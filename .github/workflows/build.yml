name: Rust Windows Build

on:
  push:
    # 「v1.0」や「v0.1.0-alpha」なタグがプッシュされたら動く
    tags:
      - 'v*'
  # GitHubの画面から手動でいつでも走らせられるように
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Windows (Ubuntu上でクロスコンパイル)
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu, artifact-name: windows }
          # Linux (Ubuntu上でネイティブビルド)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact-name: linux }
          # macOS (macOS環境でネイティブビルド)
          - { os: macos-latest,  target: x86_64-apple-darwin, artifact-name: macos }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.job.target }}

    # Windowsの時だけMinGWをインストール
    - name: Install MinGW (Only for Windows cross-build)
      if: matrix.job.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Build
      run: cargo build --release --target ${{ matrix.job.target }}

    # 出来上がったバイナリを整理して成果物としてアップ
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        # 名前を「old_maid-v1.0.0-windows」みたいに綺麗に揃える
        name: old_maid-${{ github.ref_name }}-${{ matrix.job.artifact-name }}
        path: |
          target/${{ matrix.job.target }}/release/*.exe
          target/${{ matrix.job.target }}/release/old_maid
        if-no-files-found: ignore
